services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "node node_modules/esbuild/install.js && npm run dev:docker"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=development
    volumes:
      - .:/app
      - /app/.next
    ports:
      - "8080:8080"


